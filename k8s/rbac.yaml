apiVersion: v1
kind: ServiceAccount
metadata:
  name: faas-controller-sa
  namespace: faas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faas-controller-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "pods/status", "services", "services/status", "endpoints", "configmaps", "nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: faas-controller-rolebinding
subjects:
  - kind: ServiceAccount
    name: faas-controller-sa
    namespace: faas-system
roleRef:
  kind: ClusterRole
  name: faas-controller-role
  apiGroup: rbac.authorization.k8s.io
